<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchLens - technology stack recommendations</title>
<meta name="description" content="Describe a project and get an explained, rule-based technology stack recommendation.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css?v=5">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="#/start" aria-label="ArchLens, start">
    <svg class="mark" viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="16" cy="16" r="12.5"/>
      <path d="M9.5 13 16 9.5 22.5 13 16 16.5Z"/>
      <path d="M9.5 17 16 20.5 22.5 17"/>
      <path d="M12.2 20.4 16 22.5 19.8 20.4" opacity=".55"/>
    </svg>
    <span class="brand-name">ArchLens</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#/start" data-route="start">Start</a>
    <a href="#/review" data-route="review">Review</a>
    <a href="#/result" data-route="result">Result</a>
    <a href="#/calculations" data-route="calculations">Calculations</a>
  </nav>
  <button id="llm-toggle" class="llm" type="button" role="switch" aria-checked="false">
    <span class="llm-track" aria-hidden="true"><span class="llm-knob"></span></span>
    <span class="llm-text">AI <b id="llm-state">off</b></span>
  </button>
</header>
<main id="main" tabindex="-1"></main>
<footer class="foot">
  <span>ArchLens, StackSense engine <span id="engine-version"></span></span>
  <span>The stack is chosen by rules and scoring. AI never decides it.</span>
</footer>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<script src="/js/app.js?v=5"></script>
</body>
</html>
